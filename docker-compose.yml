services:
  safety_ai:
    build: .
    container_name: safety_ai
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./shared:/app/shared
    environment:
      # Mac mini의 로컬 Ollama에 연결 (host.docker.internal은 Mac/Windows Docker 자동 지원)
      - OLLAMA_HOST=http://host.docker.internal:11434
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal
      - TOKENIZERS_PARALLELISM=false
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 서버일 경우 필요
