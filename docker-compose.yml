services:
  safety_ai:
    build: .
    container_name: safety_ai
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./shared:/app/shared
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - NO_PROXY=localhost,127.0.0.1,ollama
      - TOKENIZERS_PARALLELISM=false
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - safety_net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - safety_net
    # GPU 사용 시 아래 주석 해제
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_data:

networks:
  safety_net:
    driver: bridge
