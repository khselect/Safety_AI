# 이 파일을 기존 sielain.com nginx 설정에 포함시키거나
# /etc/nginx/conf.d/ 또는 sites-available에 추가하세요.
#
# 기존 server 블록 안에 아래 location 블록을 추가하면 됩니다.

location /safety_ai {
    proxy_pass         http://127.0.0.1:8501/safety_ai;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # WebSocket (Streamlit 실시간 통신에 필수)
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";

    proxy_read_timeout 86400;
}

# Streamlit 내부 정적 리소스
location /_stcore/ {
    proxy_pass         http://127.0.0.1:8501/_stcore/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
}
